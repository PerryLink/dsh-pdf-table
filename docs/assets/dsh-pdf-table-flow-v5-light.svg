<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="ptT ptD">
<title id="ptT">dsh-pdf-table structure: text items cluster into rows and columns inside the read-only panel, then the CSV text crosses one guarded write seam into the local exports directory</title>
<desc id="ptD">The R0 read-only panel takes the text items of report.pdf, groups them into rows by y (3pt), splits cells on x gaps above 6pt, clusters cell starts into four columns at 18pt tolerance, drops the single-block prose row, and yields a 3 by 4 rows[y][x] grid. The tail turns down into the R1 write zone: toCsv() produces RFC 4180 quoted text, one guarded seam (filename whitelist, base prefix, realpath) admits it, and the file lands at $DSH_HOME/dsh-pdf-table/exports/ with a sha256 receipt.</desc>
<defs>
  <linearGradient id="ptBg" x1="0" y1="0" x2="0.25" y2="1">
    <stop offset="0" stop-color="#f9f6fd"/>
    <stop offset="1" stop-color="#e4eaf8"/>
  </linearGradient>
  <filter id="ptSoft" x="-25%" y="-25%" width="155%" height="170%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b1735" flood-opacity="0.16"/>
  </filter>
  <pattern id="ptDots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.3" cy="1.3" r="1.3" fill="#e7e4f0"/>
  </pattern>
</defs>
<rect width="1100" height="660" rx="22" fill="url(#ptBg)"/>
<rect width="1100" height="660" rx="22" fill="url(#ptDots)" opacity=".55"/>

